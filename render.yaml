services:

  # ==========================================
  # PROVE BACKEND - FastAPI
  # ==========================================
  - type: web
    name: prove-backend
    runtime: python
    plan: free
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: LLM_PROVIDER
        value: gemini

      - key: GEMINI_API_KEY
        sync: false

      - key: DATABASE_URL
        value: sqlite:///./prove.db


  # ==========================================
  # PROVE FRONTEND - React + Vite
  # ==========================================
  - type: web
    name: prove-frontend
    runtime: static
    rootDir: frontend

    buildCommand: npm ci && npm run build

    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        sync: false